[project]
site_url = "https://iolaus.ziroau.com"
site_name = "Iolaus Docs"
site_description = "Iolaus is a library mod that provides a number of useful things for extending Heracles (aka Odyssey Quests) in your own mods."
site_dir = "build/site"
site_author = "Hudson M."

copyright = "Copyright &copy; 2026 Hudson M."

repo_url = "https://github.com/hudsonm62/Iolaus"
repo_name = "hudsonm62/Iolaus"
edit_uri = "edit/master/docs/"

nav = [
  { "Home" = "index.md" },
  { "Using the Library" = "usage/index.md" },
  { "Advanced" = [
    "advanced/index.md",
    "advanced/enums.md",
    { "📃 KDocs" = "/api" }
  ] },
]

# extra_css = ["stylesheets/extra.css"]
# extra_javascript = ["javascripts/extra.js"]

[project.theme]
# variant = "classic"
# custom_dir = "overrides"
favicon = "assets/logo.png"
language = "en"
features = [
  "announce.dismiss",
  # "content.action.edit",
  # "content.action.view",
  "content.code.annotate",
  "content.code.copy",
  "content.code.select",
  "content.footnote.tooltips",
  "content.tabs.link",
  "content.tooltips",
  # "header.autohide",
  # "navigation.expand",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.instant.progress",
  "navigation.path",
  # "navigation.prune",
  # "navigation.sections",
  # "navigation.tabs",
  # "navigation.tabs.sticky",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  # "toc.follow",
  # "toc.integrate",
]

logo = "assets/logo.png"

[project.theme.icon]
repo = "fontawesome/brands/github-alt"
# logo = "lucide/smile"

[project.theme.font]
text = "Inter"
code = "Jetbrains Mono"

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[[project.extra.social]]
icon = "simple/modrinth"
link = "https://modrinth.com/project/BxQzS0ON"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/hudsonm62/Iolaus"

[[project.extra.social]]
icon = "simple/kotlin"
link = "/api"

[project.extra.consent]
title = "Cookie consent"
description = """
  We use cookies to recognize your repeated visits and preferences, as well
  as to measure the effectiveness of our documentation and whether users
  find what they're searching for. With your consent, you're helping us to
  make our documentation better.
"""

[project.plugins.minify]
minify_html = true

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
toc.permalink = true
pymdownx.arithmatex.generic = true
pymdownx.betterem = {}
pymdownx.caret = {}
pymdownx.details = {}
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.magiclink = {}
pymdownx.mark = {}
pymdownx.smartsymbols = {}
# pymdownx.snippets.base_path = "includes"
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
pymdownx.tabbed.combine_header_slug = true
pymdownx.tasklist.custom_checkbox = true
pymdownx.tilde = {}
