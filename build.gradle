plugins {
    id 'dev.architectury.loom' version '1.17-SNAPSHOT' apply false
    id 'architectury-plugin' version '3.5-SNAPSHOT'
    id 'com.gradleup.shadow' version '9.4.3' apply false
    id 'org.jetbrains.kotlin.jvm' version '2.4.0' apply false
    id 'org.jetbrains.dokka' version '2.2.0' apply false
    id 'idea'
}

architectury {
    minecraft = project.minecraft_version
}

allprojects {
    group = rootProject.maven_group
    version = rootProject.mod_version
}

subprojects {
    apply plugin: 'dev.architectury.loom'
    apply plugin: 'architectury-plugin'
    apply plugin: 'maven-publish'
    apply plugin: 'org.jetbrains.kotlin.jvm'
    apply plugin: 'org.jetbrains.dokka'

    base {
        archivesName = rootProject.archives_name
    }
    version = "${rootProject.mod_version}+${project.name}"

    repositories {
        maven {
            name = "Team Resourceful"
            url = "https://maven.teamresourceful.com/repository/maven-public/"
        }
        maven {
            name = "DeDiamondPro"
            url = "https://maven.dediamondpro.dev/releases"
        }
    }

    dependencies {
        minecraft "net.minecraft:minecraft:$rootProject.minecraft_version"
        mappings loom.layered {
            it.mappings("net.fabricmc:yarn:$rootProject.yarn_mappings:v2")
            it.mappings("dev.architectury:yarn-mappings-patch-neoforge:$rootProject.yarn_mappings_patch_neoforge_version")
        }
    }

    java {
        withSourcesJar()
        sourceCompatibility = JavaVersion.VERSION_21
        targetCompatibility = JavaVersion.VERSION_21
    }

    // bundle common in source jars
    if (project.name in ["fabric", "neoforge"]) {
        tasks.named("sourcesJar", Jar) {
            def commonSources = project(":common").tasks.named("sourcesJar", Jar)

            dependsOn commonSources

            from(commonSources.flatMap { it.archiveFile }.map { zipTree(it) }) {
                exclude "META-INF/MANIFEST.MF"
            }
        }
    }

    kotlin {
        jvmToolchain(21)
    }

    tasks.withType(JavaCompile).configureEach {
        it.options.release = 21
    }

    tasks.named("jar", Jar) {
        from(rootProject.file("LICENSE")) {
            rename { "${it}" }
        }
    }

    // dokka javadocs
    if (project.name in ["fabric", "neoforge"]) {
        dependencies {
            dokka project(":common")
        }
    }
    tasks.register("dokkaJavadocJar", Jar) {
        group = "documentation"
        description = "Packages Dokka documentation into a Javadoc JAR"

        archiveClassifier.set("javadoc")

        from(tasks.named("dokkaGeneratePublicationHtml").flatMap {
            it.outputDirectory
        })
    }
    tasks.named("assemble") {
        dependsOn(tasks.named("dokkaJavadocJar"))
    }
    publishing {
        publications {
            mavenJava(MavenPublication) {
                artifactId = base.archivesName.get()
                from components.java
                artifact(tasks.named("dokkaJavadocJar"))
            }
        }
        repositories {}
    }
}
