plugins {
    id 'com.gradleup.shadow'
}

architectury {
    platformSetupLoomIde()
    neoForge()
}

// Test Mod Config
sourceSets {
    testmod {
        compileClasspath += sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.runtimeClasspath
    }
}
loom {
    mods {
        "iolaus" {
            sourceSet sourceSets.main
        }

        "iolaus_testmod" {
            sourceSet sourceSets.testmod
        }
    }

    runs {
        testmodClient {
            client()
            sourceSet = sourceSets.testmod.name
            displayName = "Iolaus TestMod Client"
            runDirectory = file("run/testmod")
            generateRunConfig = true
        }
    }
}
////

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentNeoForge.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

repositories {
    maven {
        name = 'NeoForged'
        url = 'https://maven.neoforged.net/releases'
    }
    maven {
        name = 'Kotlin for Forge'
        url = 'https://thedarkcolour.github.io/KotlinForForge/'
    }
    maven {
        name = "MCEF"
        url = "https://mcef-download.cinemamod.com/repositories/releases"
    }
}

dependencies {
    neoForge "net.neoforged:neoforge:$rootProject.neoforge_version"
    implementation "thedarkcolour:kotlinforforge-neoforge:${rootProject.forge_kotlin_version}"

    common(project(path: ':common', configuration: 'namedElements')) { transitive = false }
    shadowBundle project(path: ':common', configuration: 'transformProductionNeoForge')

    // Heracles
    modImplementation ("earth.terrarium.heracles:heracles-neoforge-1.21.1:${heracles_version}"){ transitive = false }
    modImplementation ("com.teamresourceful.resourcefullib:resourcefullib-neoforge-1.21:${resourcefullib_version}")
    modImplementation ("earth.terrarium.hermes:hermes-neoforge-1.21.1:${hermes_version}"){ transitive = false }
    modImplementation ("earth.terrarium.olympus:olympus-neoforge-1.21:${olympus_version}")

    // TestMod can access the Iolaus NeoForge implementation
    testmodImplementation sourceSets.main.output
}

processResources {
    inputs.property 'version', project.version

    filesMatching('META-INF/neoforge.mods.toml') {
        expand version: inputs.properties.version
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    inputFile.set shadowJar.archiveFile
}
