name: 📃 Docs
on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths: # only run on relevant changes
      - ".github/workflows/docs.yml"
      - "zensical.toml"
      - "build-docs.ps1"
      - "docs/**"
      - "common/**"
      - "fabric/**"
      - "neoforge/**"
      - "build.gradle"
      - "gradle.properties"
      - "settings.gradle"

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: ⚙️ Checkout code
        uses: actions/checkout@v7

      - name: ⚙️ Setup JDK
        uses: actions/setup-java@v6
        with:
          java-version: 25
          distribution: temurin

      - name: ⚙️ Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false
          gradle-version: wrapper
          add-job-summary: "on-failure"

      - name: ⚙️ Make Gradlew Executable
        shell: bash
        run: chmod +x ./gradlew

      - name: ⚙️ Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: 3.x

      - name: ⚙️ Setup Zensical
        run: pip install zensical

      - name: 🏗️ Build Docs
        run: ./build-docs.ps1
        shell: pwsh

      - name: ⏫ Upload artifact
        uses: actions/upload-pages-artifact@v5
        id: upload
        with:
          path: ./build/site

      - name: ⏺ Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v5
